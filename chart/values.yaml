image:
  repository: ghcr.io/marlon56115/portfolio-v2
  tag: "2.0.0" # lo fija el repositorio de despliegue
  pullPolicy: IfNotPresent

replicaCount: 1

# URL de una API compatible con Prometheus para CPU y memoria agregadas. Se define en los valores
# del despliegue, no aquí. Vacío = el panel muestra solo tiempo activo, páginas servidas y latencia.
prometheusUrl: ""

service:
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi
